# UFactory Lite6 — 6-DoF lightweight industrial arm
# 440mm reach, 1kg payload, position-controlled.
name: lite6
urdf: assets/mujoco_menagerie/ufactory_lite6/lite6.xml
n_joints: 6
gripper_type: parallel_jaw

# DH parameters from UFactory Lite6 datasheet + URDF
# Convention: [a (m), d (m), alpha (rad), theta_offset (rad)]
dh_params:
  - [0.0,     0.2435,  1.5708,  0.0]    # joint1 (base rotation)
  - [0.200,   0.0,     0.0,     0.0]    # joint2 (shoulder)
  - [0.087,   0.0,     1.5708,  0.0]    # joint3 (elbow)
  - [0.0,     0.2276, -1.5708,  0.0]    # joint4 (wrist 1)
  - [0.0,     0.0,     1.5708,  0.0]    # joint5 (wrist 2)
  - [0.0,     0.0612,  0.0,     0.0]    # joint6 (wrist 3)

joint_limits:
  lower: [-6.2832, -2.059, -0.192, -6.2832, -2.1642, -6.2832]
  upper: [ 6.2832,  2.094,  3.927,  6.2832,  2.1642,  6.2832]

workspace_radius: 0.44   # meters (440mm reach radius)
payload_kg: 1.0
gripper_max_width: 0.055  # meters (UFactory gripper aperture)

# Padding: Lite6 has 6 joints, pad to 7 for uniform input
pad_to_n_joints: 7
