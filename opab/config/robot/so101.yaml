# SO-101 — 6-DoF low-cost robot arm ($300)
name: so101
urdf: assets/robots/so101/so101.xml
n_joints: 6
gripper_type: parallel_jaw

# DH parameters (approximate — refine after URDF calibration)
dh_params:
  - [0.0,    0.045,  1.5708,  0.0]    # base rotation
  - [-0.104, 0.0,    0.0,     0.0]    # shoulder
  - [-0.096, 0.0,    0.0,     0.0]    # elbow
  - [0.0,    0.0,    1.5708,  0.0]    # wrist 1
  - [0.0,    0.044, -1.5708,  0.0]    # wrist 2
  - [0.0,    0.036,  0.0,     0.0]    # wrist 3

joint_limits:
  lower: [-2.618, -1.571, -2.618, -2.618, -2.618, -2.618]
  upper: [ 2.618,  1.571,  2.618,  2.618,  2.618,  2.618]

workspace_radius: 0.30   # meters — much smaller than Franka/UR5
payload_kg: 0.3
gripper_max_width: 0.04  # meters

pad_to_n_joints: 7
