# Pick-and-Place task on UR5 (simulation)
name: ur5_pick
task_type: pick_and_place

env:
  _target_: opab.env.mujoco_env_runner.MuJoCoEnvRunner
  scene_xml: assets/scenes/tabletop_pick.xml
  robot_xml: assets/robots/ur5/ur5.xml
  fps: 10
  max_episode_steps: 300
  camera_names: [front, wrist]
  image_size: 96

objects:
  - type: cube
    size: 0.02
    randomize_position: true
    position_range: [[-0.05, 0.05], [-0.05, 0.05], [0.0, 0.0]]

success:
  type: object_in_zone
  zone_position: [0.3, 0.0, 0.02]
  zone_radius: 0.03
  hold_time: 1.0

domain_randomization:
  visual:
    camera_position_noise: 0.02
    lighting_intensity_range: [0.5, 1.5]
    table_color_randomize: true
  dynamics:
    joint_friction_scale: [0.7, 1.3]
    link_mass_scale: [0.8, 1.2]
    action_delay_steps: [0, 3]
    gripper_friction_scale: [0.7, 1.3]
